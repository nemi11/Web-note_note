version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp_development
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    working_dir: /rails   # ←ここを追加
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: myapp
      DATABASE_PASSWORD: password
    stdin_open: true
    tty: true
    command: tail -f /dev/null

volumes:
  db_data:
  bundle_data:
